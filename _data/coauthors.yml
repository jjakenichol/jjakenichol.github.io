# Optional: link coauthor names on the publications page to their homepages.
# Key is the coauthor's LOWERCASE last name; `firstname` must list every spelling
# that appears in _bibliography/papers.bib (initials included) or the link won't
# match. Anyone not listed here simply renders as plain text.
#
# Example:
#
# "weylandt":
#   - firstname: ["Michael", "M."]
#     url: https://example.edu/~weylandt
